name: leilao-link

# One-time (or after an unlink): pair this runner with your phone and store the
# session in the state cache that leilao-digest restores.
on:
  workflow_dispatch:
    inputs:
      phone:
        description: "Your WhatsApp number, digits only, with country code (e.g. 5511999998888)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: leilao-whatsapp
  cancel-in-progress: false

env:
  TZ: America/Sao_Paulo
  PYTHONUNBUFFERED: "1"
  WHATSAPP_PROVIDER: bridge

jobs:
  link:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: data
          key: leilao-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            leilao-state-

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the bridge client
        run: pip install "httpx>=0.27"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install the WhatsApp bridge
        working-directory: agents/leilao/whatsapp_bridge
        run: npm ci --omit=dev

      - name: Request a pairing code
        run: python -m agents.leilao.ci link --phone "${{ inputs.phone }}"

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data
          key: leilao-state-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload the bridge log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: link-log
          retention-days: 3
          if-no-files-found: ignore
          path: data/whatsapp_bridge.log
