name: leilao-digest

# 08:00 America/Sao_Paulo (UTC-3, no DST since 2019).
# GitHub's scheduler can start a few minutes late under load - that is the one
# thing this route cannot guarantee. See deploy/actions/README.md.
on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build the digest and print it without sending
        type: boolean
        default: false

permissions:
  contents: read

# Never let a link run and a digest run touch the WhatsApp session at once.
concurrency:
  group: leilao-whatsapp
  cancel-in-progress: false

env:
  TZ: America/Sao_Paulo
  PYTHONUNBUFFERED: "1"
  WHATSAPP_PROVIDER: bridge

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Restore state (database, FIPE cache)
        uses: actions/cache/restore@v4
        with:
          path: |
            data/leiloes.db
            data/fipe_cache.json
          key: leilao-db-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            leilao-db-

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: deploy/requirements-server.txt

      - name: Install Python dependencies
        run: pip install -r deploy/requirements-server.txt

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install the WhatsApp bridge
        working-directory: agents/leilao/whatsapp_bridge
        run: npm ci --omit=dev

      - name: Scan and send the digest
        env:
          # Optional: set this secret to override alerts.whatsapp.bridge_recipient.
          WHATSAPP_BRIDGE_RECIPIENT: ${{ secrets.WHATSAPP_RECIPIENT }}
        run: python -m agents.leilao.ci digest ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Save state (database, FIPE cache)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/leiloes.db
            data/fipe_cache.json
          key: leilao-db-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload the result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: digest-result
          retention-days: 7
          if-no-files-found: ignore
          path: |
            digest-result.json
            data/whatsapp_bridge.log
