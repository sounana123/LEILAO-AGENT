name: keepalive

# GitHub disables scheduled workflows in repositories with no activity for 60
# days. One tiny commit per month keeps the 08:00 digest running forever.
on:
  schedule:
    - cron: "0 12 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  touch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Record a heartbeat
        run: |
          mkdir -p .github
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/last-keepalive
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/last-keepalive
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "chore: keepalive $(date -u +%F)"
            git push
          fi
